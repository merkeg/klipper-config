[gcode_macro PRIME_LINE]
description: Prime hinter dem Bett mit horizontalem Zickzack
gcode:
    SAVE_GCODE_STATE NAME=prime_line_state

    G90                         # Absolute XYZ-Koordinaten
    M83                         # Relative Extrusion

    # 2. Filament hinter dem Bett extrudieren
    G1 E5 F180
    G4 P400

    # 3. Auf das Druckbett fahren
    G1 X250 Y345 Z0.30 E2 F900

    # 4. Horizontales Zickzack nach rechts
    G1 X260 Y342 E0.9 F1200
    G1 X270 Y345 E0.9
    G1 X280 Y342 E0.9
    G1 X290 Y345 E0.9
    G1 X300 Y342 E0.9
    G1 X310 Y345 E0.9
    G1 X320 Y342 E0.9

    # 5. Abschluss
    G1 E-0.5 F1800
    G1 Z2 F1200

    RESTORE_GCODE_STATE NAME=prime_line_state MOVE=0