[gcode_macro PRIME_LINE]
description: Zieht eine Prime-Line vorne auf dem Druckbett
gcode:
    SAVE_GCODE_STATE NAME=prime_line_state

    G90                         # Absolute XYZ-Koordinaten
    M83                         # Relative Extrusion

    G1 Z5 F3000
    G1 X10 Y5 F12000
    G1 Z0.30 F600

    G1 E5 F300                  # Kleine Menge zum Füllen der Düse
    G1 X150 E12 F1200           # Prime-Line
    G1 E-0.5 F1800             # Etwas zurückziehen
	G1 Z1 F1200

    RESTORE_GCODE_STATE NAME=prime_line_state MOVE=0