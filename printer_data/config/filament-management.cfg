#####################################################################
#   Guided filament loading / unloading for KlipperScreen
#####################################################################

[gcode_macro _FILAMENT_PARK]
description: Helper: parks the toolhead front-left and lowers the Trident bed
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set park_z = [current_z + 50.0, max_z - 5.0]|min %}

    G90
    G1 Z{park_z} F1800
    G1 X30 Y30 F6000

[gcode_macro _FILAMENT_MATERIAL_PROMPT]
description: Helper: asks for material and starts heating
gcode:
    {% set mode = params.MODE|default("LOAD")|upper %}
    RESPOND TYPE=command MSG="action:prompt_begin Filament auswählen"
    RESPOND TYPE=command MSG="action:prompt_text Material wählen. Das Hotend beginnt danach aufzuheizen."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA (210 C)|_FILAMENT_HEAT MODE={mode} MATERIAL=PLA TEMP=210|primary"
    RESPOND TYPE=command MSG="action:prompt_button PETG (240 C)|_FILAMENT_HEAT MODE={mode} MATERIAL=PETG TEMP=240|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button ABS (250 C)|_FILAMENT_HEAT MODE={mode} MATERIAL=ABS TEMP=250|warning"
    RESPOND TYPE=command MSG="action:prompt_button ASA (255 C)|_FILAMENT_HEAT MODE={mode} MATERIAL=ASA TEMP=255|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button TPU (225 C)|_FILAMENT_HEAT MODE={mode} MATERIAL=TPU TEMP=225|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button Abbrechen|_FILAMENT_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FILAMENT_HEAT]
description: Helper: stores material temperature and opens the next prompt
gcode:
    {% set mode = params.MODE|default("LOAD")|upper %}
    {% set material = params.MATERIAL|default("PLA")|upper %}
    {% set temp = params.TEMP|default(210)|int %}

    SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=target_temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=material VALUE='"{material}"'
    M104 S{temp}

    RESPOND TYPE=command MSG="action:prompt_end"
    {% if mode == "UNLOAD" %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament entladen"
        RESPOND TYPE=command MSG="action:prompt_text {material} wird auf {temp} C aufgeheizt. Danach Entladen starten."
        RESPOND TYPE=command MSG="action:prompt_footer_button Aufheizen und entladen|_UNLOAD_FILAMENT_RUN|primary"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament einführen"
        RESPOND TYPE=command MSG="action:prompt_text {material} wird auf {temp} C aufgeheizt. Filament von Hand bis an die Extruder-Zahnräder schieben."
        RESPOND TYPE=command MSG="action:prompt_footer_button Filament ist bereit|_LOAD_FILAMENT_RUN|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Abbrechen|_FILAMENT_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FILAMENT_STATE]
description: Internal state for the guided filament workflow
variable_target_temp: 210
variable_material: "PLA"
gcode:

[gcode_macro LOAD_FILAMENT]
description: Geführtes Filamentladen mit Materialauswahl
gcode:
    {% if printer.print_stats.state|lower == "printing" and not printer.pause_resume.is_paused %}
        { action_raise_error("Filament kann während eines laufenden Drucks nicht geladen werden.") }
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _FILAMENT_PARK
    _FILAMENT_MATERIAL_PROMPT MODE=LOAD

[gcode_macro _LOAD_FILAMENT_RUN]
description: Helper: heats, feeds and purges filament
gcode:
    {% set temp = printer["gcode_macro _FILAMENT_STATE"].target_temp|int %}
    {% set material = printer["gcode_macro _FILAMENT_STATE"].material %}

    RESPOND TYPE=command MSG="action:prompt_end"
    M109 S{temp}
    SAVE_GCODE_STATE NAME=guided_load_state
    M83
    G92 E0
    G1 E45 F600                 # Feed from Clockwork 2 gears to melt zone
    G1 E35 F180                 # Slow purge for a visible colour change
    G1 E-5.0 F1800             # Relieve nozzle pressure to reduce oozing
    RESTORE_GCODE_STATE NAME=guided_load_state MOVE=0
    _FILAMENT_PURGE_PROMPT MATERIAL={material}

[gcode_macro _FILAMENT_PURGE_PROMPT]
description: Helper: asks whether the new colour is clean
gcode:
    {% set material = params.MATERIAL|default("Filament") %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Farbwechsel prüfen"
    RESPOND TYPE=command MSG="action:prompt_text Ist die neue Farbe sauber, oder soll weiter gespült werden?"
    RESPOND TYPE=command MSG="action:prompt_button Weitere 20 mm|_LOAD_FILAMENT_MORE|warning"
    RESPOND TYPE=command MSG="action:prompt_footer_button Farbe passt|_LOAD_FILAMENT_FINISH|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Abbrechen|_FILAMENT_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_FILAMENT_MORE]
description: Helper: purges another 20 mm
gcode:
    {% set temp = printer["gcode_macro _FILAMENT_STATE"].target_temp|int %}
    {% set material = printer["gcode_macro _FILAMENT_STATE"].material %}

    RESPOND TYPE=command MSG="action:prompt_end"
    M109 S{temp}
    SAVE_GCODE_STATE NAME=guided_purge_state
    M83
    G1 E1.0 F1200              # Undo the previous anti-ooze retract
    G1 E20 F180
    G1 E-5.0 F1800
    RESTORE_GCODE_STATE NAME=guided_purge_state MOVE=0
    _FILAMENT_PURGE_PROMPT MATERIAL={material}

[gcode_macro _LOAD_FILAMENT_FINISH]
description: Helper: completes loading and cools the hotend
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    RESPOND MSG="Filament geladen. 1 mm Sicherheitsrückzug ist aktiv; Hotend kühlt ab."

[gcode_macro UNLOAD_FILAMENT]
description: Geführtes Filamententladen mit Materialauswahl
gcode:
    {% if printer.print_stats.state|lower == "printing" and not printer.pause_resume.is_paused %}
        { action_raise_error("Filament kann während eines laufenden Drucks nicht entladen werden.") }
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _FILAMENT_PARK
    _FILAMENT_MATERIAL_PROMPT MODE=UNLOAD

[gcode_macro _UNLOAD_FILAMENT_RUN]
description: Helper: heats, forms a tip and retracts filament from Clockwork 2
gcode:
    {% set temp = printer["gcode_macro _FILAMENT_STATE"].target_temp|int %}

    RESPOND TYPE=command MSG="action:prompt_end"
    M109 S{temp}
    SAVE_GCODE_STATE NAME=guided_unload_state
    M83
    G92 E0
    G1 E5 F180                  # Small purge before forming the tip
    G1 E-15 F300                # Pull slowly out of the melt zone
    G1 E-55 F1200               # Then retract beyond the drive gears
    RESTORE_GCODE_STATE NAME=guided_unload_state MOVE=0
    M104 S0

    RESPOND TYPE=command MSG="action:prompt_begin Filament entladen"
    RESPOND TYPE=command MSG="action:prompt_text Filament ist aus dem Extruder zurückgezogen. Jetzt von Hand herausziehen."
    RESPOND TYPE=command MSG="action:prompt_footer_button Fertig|_FILAMENT_DONE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FILAMENT_CANCEL]
description: Helper: cancels the guided filament workflow
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    RESPOND MSG="Filamentvorgang abgebrochen; Hotend kühlt ab."

[gcode_macro _FILAMENT_DONE]
description: Helper: closes the filament prompt
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"